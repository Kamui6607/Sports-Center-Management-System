<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f6f8f7" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#0f1a16" media="(prefers-color-scheme: dark)"/><meta name="description" content="Pulse — Không gian quản lý trung tâm thể thao"/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><link rel="apple-touch-icon" href="/apple-touch-icon.png"/><title>Pulse | Sports Center</title><script>
/* Gán theme trước khi render để không nháy sai màu (Light/Dark/System, lưu ở localStorage). */
(function () {
  var pref = "system";
  try { pref = localStorage.getItem("pulse.theme") || "system"; } catch (e) {}
  var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.documentElement.style.background = dark ? "#0f1a16" : "#f6f8f7";
})();
</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
